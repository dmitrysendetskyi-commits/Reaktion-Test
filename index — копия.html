<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Test</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
    }

    .parent-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 50vh;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      background-color: #4CAF50; /* Зеленый по умолчанию */
      color: white;
      border: none;
      border-radius: 5px;
    }

    /* Стиль для ожидания */
    button.waiting {
      background-color: #f44336; /* Красный */
    }

    /* Стиль для момента клика */
    button.ready {
      background-color: #2e7d32; /* Ярко-зеленый */
    }
  </style>
</head>
<body>

  <h1>Prüfe deine Reaktion !</h1>

  <div class="parent-container">
    <button id="btn">Test starten</button>
  </div>

  <p id="result"></p>

  <script>
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');

    let startTime;
    let timeoutId;
    let state = 'start'; // Возможные состояния: 'start', 'waiting', 'ready'

    btn.addEventListener('click', () => {
      if (state === 'start') {
        // Начинаем тест: меняем кнопку на «Warte...»
        state = 'waiting';
        btn.textContent = 'Warte auf Grün...';
        btn.className = 'waiting';
        result.textContent = '';

        // Случайная задержка от 2000 до 5000 мс (2-5 сек)
        const delay = Math.floor(Math.random() * 3000) + 2000;

        timeoutId = setTimeout(() => {
          state = 'ready';
          btn.textContent = 'Drück!';
          btn.className = 'ready';
          startTime = Date.now(); // Засекаем время
        }, delay);

      } else if (state === 'waiting') {
        // Если кликнул раньше времени
        clearTimeout(timeoutId);
        state = 'start';
        btn.textContent = 'Zu früh! Es wieder versuchen';
        btn.className = '';

      } else if (state === 'ready') {
        // Успешный клик
        const reactionTime = Date.now() - startTime;
        state = 'start';
        btn.textContent = 'Es noch einmal versuchen';
        btn.className = '';
        result.textContent = "Reaktion Zeit: " + reactionTime + " ms!";
      }
    });
  </script>

</body>
</html>
